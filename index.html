<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qureo Auto Solver</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f0f0f0;
            font-size: 14px;
            line-height: 1.6;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        .log {
            max-height: 200px;
            overflow-y: auto;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 10px;
            margin-top: 15px;
            font-size: 12px;
            font-family: monospace;
        }

        .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid #eee;
        }

        .success { color: #28a745; }
        .error { color: #dc3545; }
        .info { color: #17a2b8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Qureo Auto Solver</h1>
        
        <div class="form-group">
            <label for="studentCode">كود الطالب</label>
            <input type="text" id="studentCode" placeholder="أدخل كود الطالب">
        </div>

        <div class="form-group">
            <label for="password">الباسورد</label>
            <input type="password" id="password" placeholder="أدخل الباسورد">
        </div>

        <div class="form-group">
            <label for="grade">السنة الدراسية</label>
            <select id="grade">
                <option value="">اختر السنة</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
            </select>
        </div>

        <button class="btn" id="startBtn" onclick="startSolving()">🚀 ابدأ الحل التلقائي</button>
        <button class="btn" id="stopBtn" onclick="stopSolving()" style="display:none; background: linear-gradient(135deg, #ff6b6b, #ee5a52);">⏹️ إيقاف</button>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <p style="text-align:center; margin-top:5px; color:#666;">التقدم: <span id="progressText">0%</span></p>

        <div class="status" id="statusBox">
            جاهز للبدء...
        </div>

        <div class="log" id="logBox"></div>
    </div>

    <script>
        let isRunning = false;
        let currentPuzzles = 0;
        const totalPuzzles = 210;
        let completedLessons = 0;
        const totalLessons = 42;
        let startTime = 0;

        function log(message, type = 'info') {
            const logBox = document.getElementById('logBox');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateProgress() {
            const progress = Math.min(((currentPuzzles / totalPuzzles) * 100), 100);
            document.getElementById('progressFill').style.width = `${progress}%`;
            document.getElementById('progressText').textContent = `${Math.round(progress)}%`;
            
            const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('statusBox').innerHTML = `
                ✅ الألغاز المكتملة: ${currentPuzzles} / ${totalPuzzles}<br>
                📚 الدروس المكتملة: ${completedLessons} / ${totalLessons}<br>
                ⏱️ الوقت المنقضي: ${elapsedSeconds} ثانية
            `;
        }

        async function startSolving() {
            const studentCode = document.getElementById('studentCode').value.trim();
            const password = document.getElementById('password').value.trim();
            const grade = document.getElementById('grade').value;

            if (!studentCode || !password || !grade) {
                alert('يرجى ملء جميع الحقول!');
                return;
            }

            // إعادة تعيين القيم عند البدء
            isRunning = true;
            currentPuzzles = 0;
            completedLessons = 0;
            startTime = Date.now();
            document.getElementById('logBox').innerHTML = '';
            updateProgress();

            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'block';
            
            log(`بدء الحل التلقائي...`, 'info');
            log(`كود الطالب: ${studentCode} | السنة: ${grade}`, 'info');

            try {
                await login(studentCode, password, grade);
                if (isRunning) {
                    await solveAllPuzzles();
                }
            } catch (error) {
                log(`خطأ: ${error.message}`, 'error');
            } finally {
                if (isRunning) stopSolving();
            }
        }

        async function login(code, pass, grade) {
            log('جاري تسجيل الدخول...', 'info');
            await sleep(1000);
            log('✅ تم تسجيل الدخول بنجاح! (محاكاة)', 'success');
        }

        async function solveAllPuzzles() {
            log('بدء حل الألغاز...', 'info');
            
            for (let i = 1; i <= totalPuzzles; i++) {
                if (!isRunning) break;
                
                log(`حل اللغز ${i} من ${totalPuzzles}...`, 'info');
                const res = await solvePuzzle(i);
                log(res.message, 'success');
                
                currentPuzzles = i;
                completedLessons = Math.floor(i / 5);
                updateProgress();
                
                if (i % 5 === 0) {
                    log(`🎉 تم إكمال الدرس رقم ${completedLessons}!`, 'success');
                }
                
                await sleep(Math.random() * 1000 + 500);
            }
            
            if (isRunning) {
                log('🎉🎉🎉 اكتمل حل جميع الألغاز!', 'success');
            }
        }

        async function solvePuzzle(puzzleNumber) {
            const solutions = [
                'console.log("Hello");',
                'let x = 5; let y = 10; console.log(x + y);',
                'for(let i=0; i<5; i++) { console.log(i); }',
                'function add(a,b) { return a+b; } console.log(add(2,3));',
                'const arr = [1,2,3]; arr.forEach(item => console.log(item));'
            ];
            
            const solution = solutions[(puzzleNumber - 1) % solutions.length];
            return {
                success: true,
                message: `تم قبول الحل: ${solution}`
            };
        }

        function stopSolving() {
            if (!isRunning) return;
            isRunning = false;
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('stopBtn').style.display = 'none';
            log('⏹️ تم إيقاف العملية.', 'error');
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
</body>
</html>
